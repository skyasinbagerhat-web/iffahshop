<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | IFFAH Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

<div class="container">

<h1>✅ Checkout</h1>

<p>অর্ডার সম্পন্ন করুন</p>

</div>

<div id="userAuthBox"></div>


</header>

<section class="products-page">

<div class="container">

<form id="checkoutForm">

<input
type="text"
id="name"
placeholder="আপনার নাম"
required>

<input
type="tel"
id="phone"
placeholder="মোবাইল নম্বর"
required>

<textarea
id="address"
placeholder="সম্পূর্ণ ঠিকানা"
required></textarea>

<select id="payment" required>

<option value="">পেমেন্ট পদ্ধতি</option>

<option>Cash On Delivery</option>

<option>bKash</option>

<option>Nagad</option>

<option>Rocket</option>

</select>

<button
type="submit"
class="btn">

✅ অর্ডার নিশ্চিত করুন

</button>
</form>

</div>

</section>

<footer class="footer">

<div class="footer-container">

<div class="footer-box">

<h3>IFFAH Shop</h3>

<p>বিশ্বাসের সাথে মানসম্মত পণ্য।</p>

</div>

<div class="footer-box">

<h3>যোগাযোগ</h3>

<p>📞 01978236232</p>

<p>📍 বাংলাদেশ</p>

</div>

</div>

<p class="copyright">

© 2026 IFFAH Shop. All Rights Reserved.

</p>

</footer>

<script src="script.js"></script>

<script src="user-auth.js"></script>


</body>

</html>
