<script>

/* =========================================
   LOAD CANCELLED ORDERS
========================================= */

function loadCancelledOrders() {

    const container =
        document.getElementById(
            "cancelledOrderList"
        );


    if (!container) {
        return;
    }


    const orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    const cancelledOrders =
        orders.filter(function(order) {

            return order.status === "Cancelled";

        });


    if (cancelledOrders.length === 0) {

        container.innerHTML = `

            <div class="card">

                <h3 style="text-align:center;">

                    📭 কোনো Cancelled Order নেই

                </h3>

            </div>

        `;

        return;

    }


    let html = "";


    cancelledOrders.forEach(
        function(order) {


            let total = 0;


            order.products.forEach(
                function(item) {

                    total +=
                        Number(item.price);

                }
            );


            let productHTML = "";


            order.products.forEach(
                function(item) {

                    productHTML += `

                        <p>

                            📦 ${item.name}
                            — ৳${item.price}

                        </p>

                    `;

                }
            );


            html += `

                <div class="card">

                    <h3>

                        👤 ${order.name}

                    </h3>


                    <p>

                        🆔 Order ID:

                        <strong>

                            ${order.id}

                        </strong>

                    </p>


                    <p>

                        📞 ${order.phone}

                    </p>


                    <p>

                        📍 ${order.address}

                    </p>


                    <p>

                        💳 ${order.payment}

                    </p>


                    <hr>


                    ${productHTML}


                    <hr>


                    <p>

                        📦 মোট পণ্য:

                        <strong>

                            ${order.products.length}

                        </strong>

                    </p>


                    <p>

                        💰 মোট মূল্য:

                        <strong>

                            ৳${total}

                        </strong>

                    </p>


                    <p>

                        📅 ${order.date}

                    </p>


                    <p>

                        📌 Status:

                        <strong>

                            ❌ Cancelled

                        </strong>

                    </p>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


loadCancelledOrders();

</script>
