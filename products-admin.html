<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Products Management | IFFAH Shop</title>

<link rel="stylesheet" href="style.css">

</head>

<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header class="header">

<div class="container">

<h1>📦 Products Management</h1>

<p>IFFAH Shop Admin Dashboard</p>

</div>

</header>



<!-- ============================= -->
<!-- PRODUCT SUMMARY -->
<!-- ============================= -->

<section>

<div class="container">

<div class="dashboard-card"
style="text-align:center;">

<h3>📦 Total Products</h3>

<h2 id="productsAdminTotal">
0
</h2>

</div>

</div>

</section>



<!-- ============================= -->
<!-- SEARCH -->
<!-- ============================= -->

<section>

<div class="container">

<h2 class="text-center">
🔎 Product Search
</h2>

<input
type="text"
id="adminProductSearch"
placeholder="Product Name দিয়ে Search করুন..."
oninput="searchAdminProducts()"
style="
width:100%;
padding:12px;
margin-bottom:20px;
box-sizing:border-box;
">


</div>

</section>



<!-- ============================= -->
<!-- PRODUCTS -->
<!-- ============================= -->

<section>

<div class="container">

<h2 class="text-center">
📦 All Products
</h2>

<div id="productsAdminList">

</div>

</div>

</section>



<!-- ============================= -->
<!-- ADMIN MENU -->
<!-- ============================= -->

<section>

<div class="container"
style="text-align:center;">

<a
href="admin.html"
class="btn">

⚙️ Dashboard

</a>


<a
href="add-product.html"
class="btn">

➕ Add Product

</a>


<a
href="index.html"
class="btn">

🏠 Home

</a>


<button
class="btn"
onclick="logout()">

🚪 Logout

</button>

</div>

</section>



<!-- ============================= -->
<!-- FOOTER -->
<!-- ============================= -->

<footer class="footer">

<div class="footer-container">

<div class="footer-box">

<h3>
IFFAH Shop
</h3>

<p>
Products Management
</p>

</div>


<div class="footer-box">

<h3>
যোগাযোগ
</h3>

<p>
📞 01978236232
</p>

<p>
📍 বাংলাদেশ
</p>

</div>

</div>


<p class="copyright">

© 2026 IFFAH Shop. All Rights Reserved.

</p>

</footer>



<!-- ============================= -->
<!-- LOGIN PROTECTION -->
<!-- ============================= -->

<script>

if (
localStorage.getItem("isLoggedIn")
!== "true"
) {

window.location.href =
"login.html";

}

</script>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>

<script src="script.js"></script>


</body>

</html>
