<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>User Login | IFFAH Shop</title>

<link rel="stylesheet" href="style.css">

<style>

.user-login-page {
    max-width: 500px;
    margin: 35px auto;
    padding: 0 15px;
}

.user-login-card {
    background: #fff;
    padding: 25px;
    border-radius: 18px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 6px 25px rgba(0,0,0,.08);
}

.user-login-card h2 {
    text-align: center;
    color: #0f5d3d;
    margin: 0 0 8px;
}

.login-subtitle {
    text-align: center;
    color: #777;
    font-size: 14px;
    margin-bottom: 22px;
}

.user-login-card label {
    display: block;
    font-weight: 600;
    margin: 12px 0 6px;
}

.user-login-card input {
    width: 100%;
    padding: 12px;
    border: 1px solid #d1d5db;
    border-radius: 8px;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 15px;
}

.user-login-card input:focus {
    outline: none;
    border-color: #0f5d3d;
}

.user-login-btn {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 9px;
    background: #0f5d3d;
    color: #fff;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
}

.user-login-btn:hover {
    background: #28a745;
}

.login-error {
    display: none;
    margin-top: 15px;
    padding: 12px;
    text-align: center;
    border-radius: 8px;
    background: #fee2e2;
    color: #b91c1c;
    border: 1px solid #fecaca;
}

.login-register {
    text-align: center;
    margin-top: 20px;
    padding-top: 18px;
    border-top: 1px solid #eee;
}

.login-register a {
    color: #0f5d3d;
    font-weight: 700;
    text-decoration: none;
}

</style>

</head>

<body>


<header class="header">

<div class="container">

<h1>🛍️ IFFAH Shop</h1>

<p>User Login</p>

<div class="menu">

<a
href="index.html"
class="btn">
🏠 হোম
</a>

<a
href="products.html"
class="btn">
🛍️ পণ্য
</a>

<a
href="register.html"
class="btn">
📝 Registration
</a>

</div>

</div>

</header>



<section>

<div class="user-login-page">

<div class="user-login-card">

<h2>
🔐 User Login
</h2>

<p class="login-subtitle">
আপনার IFFAH Shop Account-এ Login করুন
</p>


<form id="userLoginForm">


<label for="loginUsername">

🔑 Username

</label>

<input
type="text"
id="loginUsername"
placeholder="আপনার Username লিখুন"
required
autocomplete="username">



<label for="loginPassword">

🔒 Password

</label>

<input
type="password"
id="loginPassword"
placeholder="আপনার Password লিখুন"
required
autocomplete="current-password">



<button
type="submit"
class="user-login-btn">

🔐 Login করুন

</button>


</form>


<div
id="loginError"
class="login-error">
</div>


<div class="login-register">

<p>
Account নেই?
</p>

<a href="register.html">

📝 নতুন Registration করুন

</a>

</div>

</div>

</div>

</section>



<footer class="footer">

<div class="footer-container">

<div class="footer-box">

<h3>
IFFAH Shop
</h3>

<p>
বিশ্বাসের সাথে মানসম্মত পণ্য।
</p>

</div>

<div class="footer-box">

<h3>
যোগাযোগ
</h3>

<p>
📞 01978236232
</p>

<p>
📍 বাংলাদেশ
</p>

</div>

</div>

<p class="copyright">

© 2026 IFFAH Shop. All Rights Reserved.

</p>

</footer>



<script>

document
.getElementById("userLoginForm")
.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById(
                "loginUsername"
            )
            .value
            .trim();


        const password =
            document
            .getElementById(
                "loginPassword"
            )
            .value;


        const errorBox =
            document
            .getElementById(
                "loginError"
            );


        errorBox.style.display =
            "none";


        let users = [];


        try {

            users =
                JSON.parse(
                    localStorage.getItem(
                        "iffahUsers"
                    )
                ) || [];

        }

        catch(error) {

            users = [];

        }


        if (!Array.isArray(users)) {

            users = [];

        }


        const user =
            users.find(
                function(item) {

                    return (

                        String(
                            item.username || ""
                        )
                        .toLowerCase()
                        ===
                        username.toLowerCase()

                        &&

                        String(
                            item.password || ""
                        )
                        ===
                        password

                    );

                }
            );


        if (!user) {

            errorBox.innerText =
                "❌ Username অথবা Password ভুল।";

            errorBox.style.display =
                "block";

            return;

        }


        /* ==========================
           USER LOGIN SUCCESS
        ========================== */

        localStorage.setItem(

            "iffahUserLoggedIn",

            "true"

        );


        localStorage.setItem(

            "iffahCurrentUser",

            JSON.stringify({

                id:
                    user.id,

                name:
                    user.name,

                mobile:
                    user.mobile,

                username:
                    user.username,

                address:
                    user.address

            })

        );


        alert(
            "✅ Login সফল হয়েছে।\nস্বাগতম " +
            user.name + "!"
        );


        /* ==========================
           GO HOME
        ========================== */

        window.location.href =
            "index.html";


    }
);

</script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore-compat.js"></script>

<script src="firebase-config.js"></script>


</body>

</html>
