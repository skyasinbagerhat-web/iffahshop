<script src="script.js"></script>


<script>

function loadConfirmedOrders() {

    const container =
        document.getElementById(
            "confirmedOrderList"
        );


    if (!container) {
        return;
    }


    const orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    const confirmedOrders =
        orders.filter(function(order) {

            return order.status === "Confirmed";

        });


    if (confirmedOrders.length === 0) {

        container.innerHTML = `

            <div class="card">

                <h3 style="text-align:center;">

                    📭 কোনো Confirmed Order নেই

                </h3>

            </div>

        `;

        return;

    }


    let html = "";


    confirmedOrders.forEach(
        function(order) {


            let total = 0;


            order.products.forEach(
                function(item) {

                    total +=
                        Number(item.price);

                }
            );


            let productHTML = "";


            order.products.forEach(
                function(item) {

                    productHTML += `

                        <p>
                            📦 ${item.name}
                            — ৳${item.price}
                        </p>

                    `;

                }
            );


            html += `

                <div class="card">

                    <h3>
                        👤 ${order.name}
                    </h3>


                    <p>
                        🆔 Order ID:
                        <strong>
                            ${order.id}
                        </strong>
                    </p>


                    <p>
                        📞 ${order.phone}
                    </p>


                    <p>
                        📍 ${order.address}
                    </p>


                    <p>
                        💳 ${order.payment}
                    </p>


                    <hr>


                    ${productHTML}


                    <hr>


                    <p>
                        📦 মোট পণ্য:
                        <strong>
                            ${order.products.length}
                        </strong>
                    </p>


                    <p>
                        💰 মোট মূল্য:
                        <strong>
                            ৳${total}
                        </strong>
                    </p>


                    <p>
                        📅 ${order.date}
                    </p>


                    <p>
                        📌 Status:
                        <strong>
                            🟢 Confirmed
                        </strong>
                    </p>


                    <div class="btn-group">

                        <button
                            class="btn-small"
                            onclick="markDelivered('${order.id}')">

                            🚚 Delivered

                        </button>


                        <button
                            class="btn-small"
                            onclick="cancelConfirmedOrder('${order.id}')">

                            ❌ Cancel

                        </button>

                    </div>

                </div>

            `;

        }
    );


    container.innerHTML =
        html;

}


/* =========================================
   MARK DELIVERED
========================================= */

function markDelivered(orderId) {

    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    const index =
        orders.findIndex(function(order) {

            return order.id === orderId;

        });


    if (index === -1) {

        alert("❌ Order পাওয়া যায়নি");

        return;

    }


    orders[index].status =
        "Delivered";


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "🚚 Order Delivered হিসেবে Update হয়েছে"
    );


    loadConfirmedOrders();

}


/* =========================================
   CANCEL ORDER
========================================= */

function cancelConfirmedOrder(orderId) {

    if (
        !confirm(
            "আপনি কি এই Order Cancel করতে চান?"
        )
    ) {

        return;

    }


    let orders =
        JSON.parse(
            localStorage.getItem("orders")
        ) || [];


    const index =
        orders.findIndex(function(order) {

            return order.id === orderId;

        });


    if (index === -1) {

        alert("❌ Order পাওয়া যায়নি");

        return;

    }


    orders[index].status =
        "Cancelled";


    localStorage.setItem(
        "orders",
        JSON.stringify(orders)
    );


    alert(
        "❌ Order Cancelled হয়েছে"
    );


    loadConfirmedOrders();

}


loadConfirmedOrders();

</script>


</body>

</html>
